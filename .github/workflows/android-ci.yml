name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "platform-tools" >/dev/null

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk peerlink-debug.apk

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # One PERMANENT release per build, named after the commit message, so
          # every version is listed separately and any older build can still be
          # installed. The old single rolling release destroyed that history.
          SHORT="${GITHUB_SHA:0:7}"
          TAG="build-${{ github.run_number }}-$SHORT"
          NAME="$(git log -1 --pretty=%s | tr -d '\r' | cut -c1-70)"
          {
            echo "Commit: \`$GITHUB_SHA\`"
            echo
            git log -1 --pretty=%b | tr -d '\r' | cut -c1-1200
          } > release-notes.md

          gh release create "$TAG" peerlink-debug.apk \
            --target "$GITHUB_SHA" \
            --title "$NAME" \
            --notes-file release-notes.md \
            --prerelease

          # Convenience pointer only: always the newest build, overwritten.
          gh release delete "peerlink-debug-latest" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "peerlink-debug-latest" peerlink-debug.apk \
            --target "$GITHUB_SHA" \
            --title "PeerLink latest debug APK" \
            --notes "Newest build. Open the build-* releases for every earlier version." \
            --prerelease
