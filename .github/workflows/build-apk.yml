name: Build PeerLink F27

on:
  push:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/build-apk.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peerlink-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Sources are already assembled. Tests must never patch the application.
      - name: Run native, JVM and source integration checks
        run: python3 tests/run_checks.py

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android build components
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.0.12077973' >/dev/null

      - name: Compile app and run Kotlin unit tests
        run: bash gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload APK and test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PeerLink-F27-build
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            verification/
          if-no-files-found: error
